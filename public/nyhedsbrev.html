<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyhedsbrev</title>
</head>
<body>
    <!-- Nyhedsbrev -->

<section id="nyhedsbrev" class="bg-white nyhedsbrev__container">
<div class="newsletter  flex-col">
<div class="Nyhedsbrevv__text flex-col">
    <h2 class="text-black text-center text-[62px]">Nyhedsbrev</h2>
    <h3 class="text-lime-500 text-center text-[40px]">Få nyhederne fra gården på din mail.</h3>
    <p class="text-black text-center text-2xl ">Tilmeld dig vores nyhedsbrev - så kan du altid følge med i, hvad der sker på farmen.</p>
</div>
<div>
             <form>
              <div>
                <input type="email" id="email" class="w-full rounded-md border border-slate-300 px-3 py2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                </div>
                <div >
                <button class="inline-flex items-center justify-center px-4 py-2 font-medium bg-lime-500 text-white hover:bg-lime-950 cursor-pointer w-full" type="submit">Tilmeld</button>
              </div>
             </form>
</div>

</section>

  
    <!-- Nyhedsbrev END -->
     <script src="http://cdn.tailwindcss.com"></script>
</body>
</html>
